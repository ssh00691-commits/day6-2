<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영어 단어장</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #4f46e5;
      --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --line: #374151;
        --primary: #818cf8;
        --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      font-size: 16px;
    }
    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 8px 0 16px; }

    #add-form { display: grid; gap: 8px; }
    input[type=text] {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      font: inherit;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    input[type=text]:focus { outline: 2px solid var(--primary); border-color: transparent; }
    #add-form button {
      min-height: 48px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
    #error { color: var(--danger); margin: 8px 0 0; min-height: 0; }
    #error:empty { display: none; }

    #count { margin: 20px 0 8px; color: var(--muted); font-size: 15px; }

    #tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--line); border-radius: 12px; }
    #tabs button {
      min-height: 44px;
      font: inherit;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
    }
    #tabs button[aria-selected=true] { background: var(--card); color: var(--primary); font-weight: 700; }

    #list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
    #list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    #list li.empty { justify-content: center; color: var(--muted); padding: 32px 14px; }
    .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .w { font-size: 18px; overflow-wrap: anywhere; }
    .m { color: var(--muted); overflow-wrap: anywhere; }
    li.done .w, li.done .m { text-decoration: line-through; opacity: .5; }

    .check { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 4px; font-size: 14px; cursor: pointer; }
    .check input { width: 22px; height: 22px; accent-color: var(--primary); margin: 0; cursor: pointer; }
    .del {
      min-width: 56px;
      min-height: 44px;
      font: inherit;
      font-size: 14px;
      color: var(--danger);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<main>
  <h1>영어 단어장</h1>

  <form id="add-form">
    <input id="word" type="text" placeholder="단어" autocomplete="off">
    <input id="meaning" type="text" placeholder="뜻" autocomplete="off">
    <button type="submit">추가</button>
  </form>
  <p id="error" role="alert"></p>

  <p id="count"></p>

  <div id="tabs" role="tablist">
    <button type="button" role="tab" data-tab="all" aria-selected="true">전체</button>
    <button type="button" role="tab" data-tab="todo" aria-selected="false">외울 것</button>
  </div>

  <ul id="list"></ul>
</main>

  <script>
    const SUPABASE_URL = 'https://smncozbuzwdkaixmghwl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_xQ2XbPCKTsEN9OmFVkkGvg_yOB_0cng';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('add-form');
    const wordInput = document.getElementById('word');
    const meaningInput = document.getElementById('meaning');
    const listEl = document.getElementById('list');
    const errorEl = document.getElementById('error');

    const countEl = document.getElementById('count');
    const tabsEl = document.getElementById('tabs');
    let allWords = [];
    let currentTab = 'all';

    tabsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-tab]');
      if (!btn) return;
      currentTab = btn.dataset.tab;
      for (const b of tabsEl.querySelectorAll('button')) {
        b.setAttribute('aria-selected', String(b === btn));
      }
      render();
    });

    function showError(msg) {
      errorEl.textContent = msg || '';
    }

    async function loadWords() {
      const { data, error } = await db
        .from('words')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) return showError('불러오기 실패: ' + error.message);
      showError('');
      allWords = data;
      render();
    }

    // 사용자 입력은 textContent로만 넣어 HTML로 해석되지 않게 한다.
    function render() {
      const done = allWords.filter((w) => w.memorized).length;
      countEl.textContent = allWords.length + '개 중 ' + done + '개 외움';

      const words = currentTab === 'todo'
        ? allWords.filter((w) => !w.memorized)
        : allWords;
      listEl.replaceChildren();
      if (words.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = currentTab === 'todo' && allWords.length > 0
          ? '외울 단어를 모두 외웠어요!'
          : '아직 단어가 없어요. 위에서 추가해 보세요.';
        listEl.append(empty);
        return;
      }
      for (const w of words) {
        const li = document.createElement('li');
        if (w.memorized) li.classList.add('done');

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = w.memorized;
        check.addEventListener('change', () => toggleMemorized(w.id, check.checked));

        const label = document.createElement('label');
        label.className = 'check';
        const labelText = document.createElement('span');
        labelText.textContent = '외움';
        label.append(check, labelText);

        const wordEl = document.createElement('strong');
        wordEl.className = 'w';
        wordEl.textContent = w.word;

        const meaningEl = document.createElement('span');
        meaningEl.className = 'm';
        meaningEl.textContent = w.meaning;

        const text = document.createElement('div');
        text.className = 'text';
        text.append(wordEl, meaningEl);

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'del';
        del.textContent = '삭제';
        del.addEventListener('click', () => removeWord(w.id));

        li.append(text, label, del);
        listEl.append(li);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const word = wordInput.value.trim();
      const meaning = meaningInput.value.trim();
      if (!word || !meaning) return; // 빈 칸이면 저장하지 않는다.
      const { error } = await db.from('words').insert({ word, meaning });
      if (error) return showError('추가 실패: ' + error.message);
      wordInput.value = '';
      meaningInput.value = '';
      wordInput.focus();
      loadWords();
    });

    async function toggleMemorized(id, memorized) {
      const { error } = await db.from('words').update({ memorized }).eq('id', id);
      if (error) showError('저장 실패: ' + error.message);
      loadWords();
    }

    async function removeWord(id) {
      const { error } = await db.from('words').delete().eq('id', id);
      if (error) showError('삭제 실패: ' + error.message);
      loadWords();
    }

    loadWords();
  </script>
</body>
</html>
